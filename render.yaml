# Free failover host. No payment card.
# If Blueprint still asks for a card, skip it: New → Web Service → instance Free.
# After the first boot, set APP_BASE_URL to the https://….onrender.com URL.

services:
  - type: web
    name: tikitok-shop
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /welcome
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        value: file:./prisma/dev.db
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false
