name: Read Render deploy log

on:
  push:
    branches:
      - cursor/stores-survive-wake-7442
      - cursor/tikitok-rebrand-host-7442
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest Render deploy error
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: |
          KEY="${RENDER_API_KEY:-$RENDER_API_TOKEN}"
          if [ -z "$KEY" ]; then
            echo "NO_RENDER_API_KEY"
            exit 0
          fi
          curl -sS -H "Authorization: Bearer $KEY" \
            "https://api.render.com/v1/services?limit=50" | head -c 8000
          echo
          curl -sS -H "Authorization: Bearer $KEY" \
            "https://api.render.com/v1/services/srv-daqjdm3tqb8s73enapu0/deploys?limit=3"
          echo
          LATEST=$(curl -sS -H "Authorization: Bearer $KEY" \
            "https://api.render.com/v1/services/srv-daqjdm3tqb8s73enapu0/deploys?limit=1" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['deploy']['id'] if d else '')")
          echo "latest $LATEST"
          if [ -n "$LATEST" ]; then
            curl -sS -H "Authorization: Bearer $KEY" \
              "https://api.render.com/v1/services/srv-daqjdm3tqb8s73enapu0/deploys/$LATEST"
          fi
